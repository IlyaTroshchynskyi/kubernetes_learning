apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.app2.serviceName }}-{{ .Values.environment.env }}"
  namespace: "{{ .Values.appName.name}}-{{ .Values.environment.env}}"
  labels:
   app: "{{ .Values.app2.serviceName }}-{{ .Values.environment.env }}"
spec:
  selector:
    project: "{{ .Values.app2.serviceName }}-{{ .Values.environment.env }}"

  type: {{ .Values.app2.serviceType }}
  ports:
    - port: {{ .Values.app2.port }}
      targetPort: http
      protocol: TCP
      name: http
