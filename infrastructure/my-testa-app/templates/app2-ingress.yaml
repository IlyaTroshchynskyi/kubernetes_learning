apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "app2-ingress-{{ .Values.environment.env }}"
  namespace: "{{ .Values.appName.name}}-{{ .Values.environment.env}}"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: "{{ .Values.app2.serviceName }}-{{ .Values.environment.env }}"
                port:
                  number: {{ .Values.app2.port }}
