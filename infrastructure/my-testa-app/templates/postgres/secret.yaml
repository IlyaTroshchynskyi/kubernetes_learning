apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: "{{ .Values.appName.name}}-{{ .Values.environment.env}}"
type: Opaque
data:
  # Default password: postgres123 (base64 encoded)
  # To change: echo -n "your-password" | base64
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
