apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-app-config
  namespace: "{{ .Values.appName.name}}-{{ .Values.environment.env}}"
data:
  PROJECT_DESCRIPTION: "Description proj"
  DATABASE_URL: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres-{{ .Values.environment.env }}:5432/{{ .Values.postgres.database }}"
  APP2_URL: "http://{{ .Values.app2.serviceName }}-{{ .Values.environment.env }}:{{ .Values.app2.port }}"